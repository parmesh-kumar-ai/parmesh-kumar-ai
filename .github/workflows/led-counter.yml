name: Generate LED Counter

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Use the latest version of checkout (v4)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Use the latest version of setup-python (v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Specify a stable Python version
      
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests  # Add any other dependencies you need
      
      # Run your LED counter generation script
      - name: Generate LED Counter SVG
        run: |
          python scripts/generate_led_counter.py  # Adjust path to your script
      
      # Commit and push changes (if there are any)
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update LED counter [skip ci]"
            git push
          fi

name: Generate LED Counter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      # COMPREHENSIVE DEBUG STEP
      - name: Debug - Environment and Structure
        run: |
          echo "=== Python Version ==="
          python --version
          
          echo -e "\n=== Current Directory ==="
          pwd
          
          echo -e "\n=== Repository Root Contents ==="
          ls -la
          
          echo -e "\n=== Checking for scripts directory ==="
          if [ -d "scripts" ]; then
            echo "✓ scripts/ directory EXISTS"
            ls -la scripts/
          else
            echo "✗ scripts/ directory NOT FOUND"
          fi
          
          echo -e "\n=== Checking for generate_led_counter.py ==="
          if [ -f "scripts/generate_led_counter.py" ]; then
            echo "✓ generate_led_counter.py EXISTS"
            echo -e "\n--- First 20 lines of the script ---"
            head -20 scripts/generate_led_counter.py
          else
            echo "✗ generate_led_counter.py NOT FOUND"
            echo "Searching for any Python files:"
            find . -name "*.py" -type f | head -20
          fi

      # CONDITIONALLY RUN THE SCRIPT
      - name: Generate LED Counter SVG
        run: |
          if [ -f "scripts/generate_led_counter.py" ]; then
            echo "Running LED counter script..."
            python scripts/generate_led_counter.py
            echo "Script completed successfully"
          else
            echo "ERROR: Script not found!"
            echo "Creating a sample script for testing..."
            mkdir -p scripts
            cat > scripts/generate_led_counter.py << 'PYTHON_SCRIPT'
#!/usr/bin/env python3
import os
from datetime import datetime

# Sample LED counter generator
output_dir = "."
timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
content = f"""<!-- LED Counter - Generated {timestamp} -->
<svg width="200" height="50" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="50" fill="#000"/>
  <text x="100" y="35" fill="#00ff00" font-family="monospace" text-anchor="middle" font-size="20">
    Visits: {datetime.now().strftime("%d%m%Y")}
  </text>
</svg>"""
            with open("led_counter.svg", "w") as f:
              f.write(content)
            print("Sample LED counter created: led_counter.svg")
PYTHON_SCRIPT
            python scripts/generate_led_counter.py
          fi

      - name: Check Generated Files
        run: |
          echo "=== Generated Files ==="
          ls -la *.svg 2>/dev/null || echo "No SVG files found"
          
          echo -e "\n=== All files in repo ==="
          find . -type f -name "*.svg" -o -name "*.txt" -o -name "*.json" | grep -v ".git" | head -20

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update LED counter [skip ci]"
            git push
          fi
